[project]
name = "sunn"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6.0",
    "indic-transliteration>=2.3.82",
    "jiwer>=4.0.0",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "soundfile>=0.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "huggingface-hub>=2.2.0",
    "pytest>=9.1.1",
]
# The trained reranker (src/reranker.py, RERANKER_ENABLED): uv sync --group rerank.
rerank = [
    "onnxruntime>=1.31.1",
    "tokenizers>=0.23.3",
]
# The shared-model research pipeline in training/ (uv sync --group train). Not in the app or the image.
train = [
    "peft>=0.17.0",
    "torch>=2.7.0",
    "transformers>=4.56.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
