<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Sunn learns how one person speaks and says their everyday phrases back clearly, in Hindi or English." />
    <title>Sunn</title>
    <script>
      // Before the first paint, so a dark or large-text page never flashes light or small.
      // src/theme.js and src/prefs.js keep these in step afterwards.
      ;(function () {
        var root = document.documentElement
        var get = function (key) {
          try {
            return localStorage.getItem(key)
          } catch (e) {
            return null
          }
        }
        var theme = get('sunn.theme')
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        root.dataset.theme = dark ? 'dark' : 'light'
        // The same list as GROUPED in src/App.jsx.
        root.dataset.surface = /^\/app\/(phrases|progress|settings)/.test(location.pathname) ? 'grouped' : 'plain'
        if (get('sunn.large_text') === 'true') root.classList.add('large-text')
        if (get('sunn.reduced_motion') === 'true' || matchMedia('(prefers-reduced-motion: reduce)').matches) {
          root.classList.add('reduced-motion')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
