# Research pipeline for the shared correction model. Its own uv project, separate from the app:
# nothing here goes into the backend, the Docker image or the Hugging Face Space.
[project]
name = "ml"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "huggingface-hub>=2.4.0",
    "indic-transliteration>=2.3.82",
    "numpy>=2.5.4",
    "rapidfuzz>=3.14.6",
    "soundfile>=0.14.0",
    "torch>=2.11.0",
    "transformers>=5.22.1",
]

# Its own workspace root, so uv never attaches it to the app's project in the parent folder.
[tool.uv.workspace]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
